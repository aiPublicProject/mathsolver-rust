[package]
name = "mathsolver-help"
version = "0.2.0"
edition = "2021"
description = "BYOK AI math solver with execution-based verification (PAL-style) — bring your own OpenAI-compatible API key; the answer is computed locally by executing a model-generated program, never taken from a number the model stated."
license = "MIT"
repository = "https://github.com/aiPublicProject/mathsolver-rust"
homepage = "https://mathsolver.help"
keywords = ["math", "solver", "ai", "byok", "verification"]
categories = ["mathematics", "api-bindings"]

[dependencies]
serde_json = "1"
ureq = "2"

[lib]
name = "mathsolver"
path = "src/lib.rs"
